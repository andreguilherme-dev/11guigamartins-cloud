    <text x="719" y="265" font-size="14" fill="#e0eaf7">Dados</text>
    <rect x="944" y="128" width="176" height="92" rx="14" fill="#242b48" stroke="#7674aa"/>
    <text x="965" y="157" font-size="11" fill="#bcb5ff" letter-spacing="1">03 / BUILD</text>
