<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Eu faço armengue.</title>
  <desc id="desc">Um caderno de oficina: fundo escuro, letras claras, rabiscos laranja e um bilhete amarelo escrito resolvendo.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#f5ede0" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="16" fill="#202320"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)"/>
  <g font-family="Arial, sans-serif">
    <text x="52" y="52" font-size="15" fill="#acaea4">André Guilherme</text>
    <text x="48" y="135" font-size="66" font-weight="700" letter-spacing="-2" fill="#f7f1e6">Eu faço armengue.</text>
    <path d="M51 152Q267 164 608 150" fill="none" stroke="#f4a35a" stroke-width="5" stroke-linecap="round"/>
    <text x="52" y="203" font-size="24" fill="#d4d3c7">Resolvo o problema e vou ajeitando o caminho.</text>
    <text x="52" y="260" font-size="15" fill="#a5a99e">scripts · bots · painéis · e o que mais precisar</text>
  </g>
  <g transform="translate(878 65) rotate(5 112 82)">
    <rect width="226" height="165" rx="3" fill="#edcf77"/>
    <rect x="68" y="-12" width="88" height="26" transform="rotate(-8 112 1)" fill="#f3ede0" opacity=".72"/>
    <g font-family="monospace" fill="#373629">
      <text x="24" y="45" font-size="15">status:</text>
      <text x="22" y="82" font-size="24" font-weight="700">resolvendo.</text>
      <path d="M24 104H197" stroke="#75663f" stroke-width="1" opacity=".5"/>
      <text x="24" y="134" font-size="13">um ajuste por vez</text>
    </g>
  </g>
  <path d="M758 134Q804 109 846 134M830 119L847 134L827 141" fill="none" stroke="#f4a35a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
