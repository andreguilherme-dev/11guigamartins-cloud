  <rect x="48" y="45" width="34" height="4" rx="2" fill="#6ee7b7"/>
  <text x="96" y="51" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#aebdd4">AUTOMAÇÃO / DADOS / APLICAÇÕES</text>
  <text x="48" y="126" font-family="Arial, sans-serif" font-size="51" font-weight="700" letter-spacing="-1.5" fill="#f5f7fc">André Guilherme</text>
  <text x="50" y="164" font-family="Arial, sans-serif" font-size="21" fill="#c4d0e3">Da rotina manual ao software que resolve.</text>
  <rect x="50" y="200" width="558" height="1" fill="#35445e"/>
  <g font-family="Arial, sans-serif" font-size="14" fill="#d7e0ee">
    <text x="50" y="239">Python</text><text x="125" y="239">TypeScript</text><text x="232" y="239">PHP</text><text x="291" y="239">SQL</text>
  </g>
  <g fill="#6ee7b7"><circle cx="111" cy="234" r="2"/><circle cx="216" cy="234" r="2"/><circle cx="277" cy="234" r="2"/></g>
  <text x="50" y="291" font-family="monospace" font-size="12" letter-spacing="1.2" fill="#8395b3">PROCESSO → DADOS → SOLUÇÃO</text>
  <g fill="none" stroke="url(#accent)" stroke-width="2" opacity=".75">
    <path d="M821 97H854Q871 97 871 114V149H944"/>
