<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">André Guilherme — Automação, dados e aplicações</title>
  <desc id="desc">Banner azul escuro com detalhes em verde e lilás, ilustrando conexões entre automação, dados e aplicações.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/><stop offset="1" stop-color="#17233c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ee7b7"/><stop offset="1" stop-color="#a5a0ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#a5b4d0" stroke-opacity=".06"/>
    </pattern>
  </defs>
  <rect width="1200" height="330" rx="18" fill="url(#background)"/>
